<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
<title>OmniAI Workspace</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; height: 100vh; display: grid; place-items: center; background: #171717; color: #e5e5e5;
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .card { text-align: center; max-width: 440px; padding: 24px; }
  .logo { position: relative; width: 96px; height: 96px; margin: 0 auto 24px; }
  .ring { position: absolute; border-radius: 50%; border: 1px solid rgb(255 255 255 / .08); animation: spin linear infinite; }
  .ring i { position: absolute; top: 0; left: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
            background: var(--c); box-shadow: 0 0 8px var(--c), 0 0 16px var(--c); }
  .core { position: absolute; inset: 40px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #fff, #c4b5fd 45%, #6366f1);
          box-shadow: 0 0 14px #818cf8; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { transform: scale(1.25); } }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #a3a3a3; margin: 4px 0; }
  code { color: #c4b5fd; }
  .waiting { margin-top: 18px; color: #737373; font-size: 13px; }
  .dots::after { content: ""; animation: dots 1.5s steps(4) infinite; }
  @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  button { margin-top: 18px; background: #7c3aed; color: #fff; border: 0; border-radius: 8px; padding: 9px 18px; font: inherit; cursor: pointer; }
  button:hover { background: #8b5cf6; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">
      <div class="ring" style="inset:6px;animation-duration:3.2s"><i style="--c:#e07a5f"></i></div>
      <div class="ring" style="inset:19px;animation-duration:2.3s;animation-direction:reverse"><i style="--c:#4d6bfe"></i></div>
      <div class="ring" style="inset:31px;animation-duration:1.7s"><i style="--c:#a78bfa"></i></div>
      <div class="core"></div>
    </div>
    <h1>Serverga ulanib bo‘lmadi</h1>
    <p>Manzil: <code id="url"></code></p>
    <p id="hint">Ishlab chiqishda: avval <code>frontend</code> va <code>backend</code> ni ishga tushiring.</p>
    <p class="waiting">Server tayyor bo‘lishi bilan avtomatik ulanaman<span class="dots"></span></p>
    <button id="retry">Hozir qayta urinish</button>
  </div>
  <script>
    const q = new URLSearchParams(location.search);
    const url = q.get("url") || "";
    document.getElementById("url").textContent = url;
    if (!/^http:\/\/(localhost|127\.0\.0\.1)/.test(url)) {
      document.getElementById("hint").textContent = "Internet aloqasini tekshiring.";
    }
    document.getElementById("retry").onclick = () => { if (/^https?:\/\//.test(url)) location.href = url; };
  </script>
</body>
</html>
